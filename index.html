<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ABSENSIKU — Informatika SMPN 2 CIKIJING</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    body {
      background-color: #090d16;
      color: #f1f5f9;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .id-card-print {
      width: 85.6mm;
      height: 54mm;
    }
    @media print {
      body * { visibility: hidden; }
      #print-area, #print-area * { visibility: visible; }
      #print-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        background: #ffffff !important;
        color: #0f172a !important;
      }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="bg-[#090d16] text-slate-100 antialiased selection:bg-indigo-500/30 selection:text-indigo-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // =========================================================================
    // TEMPELKAN URL WEB APP GOOGLE APPS SCRIPT (/exec) ANDA DI SINI SEBELUM DEPLOY
    // =========================================================================
    const DEFAULT_GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbyluAMjncNYHHkvSejdzbvus-wApbhhtFteuCxV_QTkEtqKrZSXTx9FhdAYDDv5VvJSmw/exec";

    const STORAGE_KEYS = {
      APP_STATE: "ABSENSIKU_STATE_V2",
      SYNC_QUEUE: "ABSENSIKU_SYNC_QUEUE_V2"
    };

    const INITIAL_STATE = {
      settings: {
        teacherName: "Guru Informatika",
        nip: "",
        schoolName: "SMPN 2 CIKIJING",
        subject: "Informatika",
        semester: "Ganjil",
        academicYear: "2026/2027",
        weightDaily: 40,
        weightUts: 30,
        weightUas: 30
      },
      classes: [],
      students: [],
      meetings: [],
      materials: [],
      attendance: [],
      grades: []
    };

    function todayISO() {
      const now = new Date();
      const offsetMs = now.getTimezoneOffset() * 60000;
      return new Date(now.getTime() - offsetMs).toISOString().slice(0, 10);
    }

    function nowTimeStr() {
      return new Date().toLocaleTimeString("id-ID", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });
    }

    function normalizeRowDate(d) {
      if (!d) return "";
      const m = String(d).trim().match(/^(\d{4}-\d{2}-\d{2})/);
      return m ? m[1] : String(d).trim();
    }

    function makeDedupKey(dateStr, meetingId, studentId, nis) {
      const d = normalizeRowDate(dateStr || todayISO());
      const m = String(meetingId || "GENERAL").trim().toLowerCase();
      const s = String(studentId || nis || "").trim().toLowerCase();
      return `${d}__${m}__${s}`;
    }

    function playScanTone(type = "success") {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === "success") {
          osc.type = "sine";
          osc.frequency.setValueAtTime(880, ctx.currentTime);
          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          osc.start();
          osc.stop(ctx.currentTime + 0.12);
        } else if (type === "duplicate") {
          osc.type = "triangle";
          osc.frequency.setValueAtTime(440, ctx.currentTime);
          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          osc.start();
          osc.stop(ctx.currentTime + 0.22);
        } else {
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(240, ctx.currentTime);
          gain.gain.setValueAtTime(0.1, ctx.currentTime);
          osc.start();
          osc.stop(ctx.currentTime + 0.25);
        }
      } catch (e) {}
    }

    function computeFinalScore(daily, uts, uas, wDaily = 40, wUts = 30, wUas = 30) {
      const d = Number(daily) || 0;
      const u = Number(uts) || 0;
      const a = Number(uas) || 0;
      const sumW = (Number(wDaily) || 0) + (Number(wUts) || 0) + (Number(wUas) || 0);
      const divisor = sumW > 0 ? sumW : 100;
      return Number((((d * (Number(wDaily) || 0)) + (u * (Number(wUts) || 0)) + (a * (Number(wUas) || 0))) / divisor).toFixed(2));
    }

    function QRCodeCanvas({ value, size = 128 }) {
      const canvasRef = useRef(null);
      useEffect(() => {
        if (!canvasRef.current || !value || !window.QRCode) return;
        window.QRCode.toCanvas(canvasRef.current, String(value), {
          width: size,
          margin: 1,
          color: { dark: "#0f172a", light: "#ffffff" }
        }, () => {});
      }, [value, size]);

      return <canvas ref={canvasRef} className="rounded bg-white p-1" />;
    }

    function AttendanceBarChart({ classes, attendance, selectedDate }) {
      const chartRef = useRef(null);
      const instanceRef = useRef(null);

      const chartData = useMemo(() => {
        const labels = classes.length > 0 ? classes.map((c) => c.name) : ["Belum Ada Kelas"];
        const hadirCounts = labels.map((label) => {
          if (classes.length === 0) return 0;
          const cls = classes.find((c) => c.name === label);
          return attendance.filter(
            (r) =>
              normalizeRowDate(r.date) === selectedDate &&
              (r.classId === cls?.id || r.className === label) &&
              r.status === "Hadir"
          ).length;
        });

        const otherCounts = labels.map((label) => {
          if (classes.length === 0) return 0;
          const cls = classes.find((c) => c.name === label);
          return attendance.filter(
            (r) =>
              normalizeRowDate(r.date) === selectedDate &&
              (r.classId === cls?.id || r.className === label) &&
              r.status !== "Hadir"
          ).length;
        });

        return { labels, hadirCounts, otherCounts };
      }, [classes, attendance, selectedDate]);

      useEffect(() => {
        if (!chartRef.current || !window.Chart) return;
        if (instanceRef.current) instanceRef.current.destroy();
        instanceRef.current = new window.Chart(chartRef.current, {
          type: "bar",
          data: {
            labels: chartData.labels,
            datasets: [
              {
                label: "Hadir",
                data: chartData.hadirCounts,
                backgroundColor: "rgba(16, 185, 129, 0.8)",
                borderRadius: 6
              },
              {
                label: "Izin / Sakit / Alpha",
                data: chartData.otherCounts,
                backgroundColor: "rgba(245, 158, 11, 0.8)",
                borderRadius: 6
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { labels: { color: "#cbd5e1" } } },
            scales: {
              x: { ticks: { color: "#94a3b8" }, grid: { color: "rgba(148, 163, 184, 0.1)" } },
              y: { beginAtZero: true, ticks: { stepSize: 1, color: "#94a3b8" }, grid: { color: "rgba(148, 163, 184, 0.1)" } }
            }
          }
        });
        return () => {
          if (instanceRef.current) instanceRef.current.destroy();
        };
      }, [chartData]);

      return (
        <div className="h-64 w-full">
          <canvas ref={chartRef} />
        </div>
      );
    }

    function App() {
      const [activeTab, setActiveTab] = useState("dashboard");
      const [appState, setAppState] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEYS.APP_STATE);
          if (saved) {
            const parsed = JSON.parse(saved);
            return {
              ...INITIAL_STATE,
              ...parsed,
              settings: { ...INITIAL_STATE.settings, ...(parsed.settings || {}) }
            };
          }
        } catch (e) {}
        return INITIAL_STATE;
      });

      const [syncQueue, setSyncQueue] = useState(() => {
        try {
          const q = localStorage.getItem(STORAGE_KEYS.SYNC_QUEUE);
          return q ? JSON.parse(q) : [];
        } catch (e) {
          return [];
        }
      });

      const [syncStatus, setSyncStatus] = useState({
        state: DEFAULT_GAS_WEBAPP_URL ? "idle" : "offline",
        message: DEFAULT_GAS_WEBAPP_URL ? "Siap sinkronisasi" : "URL Web App belum diisi"
      });

      const [toast, setToast] = useState(null);

      // Scanner QR & Manual
      const [scanDate, setScanDate] = useState(todayISO());
      const [selectedMeetingId, setSelectedMeetingId] = useState("");
      const [cameraActive, setCameraActive] = useState(false);
      const [manualCodeInput, setManualCodeInput] = useState("");
      const [manualStudentId, setManualStudentId] = useState("");
      const [manualStatus, setManualStatus] = useState("Hadir");
      const [lastScanAlert, setLastScanAlert] = useState(null);

      const recentScanMapRef = useRef({});
      const scannerHtml5Ref = useRef(null);
      const processingScanRef = useRef(false);
      const isFlushingRef = useRef(false);

      // Form Kelas, Siswa, Pertemuan, Materi, Nilai, Pengaturan
      const [classForm, setClassForm] = useState({ id: "", name: "", gradeLevel: "8", homeroomTeacher: "" });
      const [studentForm, setStudentForm] = useState({ id: "", nis: "", name: "", gender: "L", classId: "" });
      const [selectedClassFilter, setSelectedClassFilter] = useState("ALL");
      const [printClassId, setPrintClassId] = useState("ALL");
      const [meetingForm, setMeetingForm] = useState({ id: "", title: "", classId: "", date: todayISO(), topic: "" });
      const [materialForm, setMaterialForm] = useState({
        id: "",
        title: "",
        category: "Informatika",
        classLevel: "8",
        semester: "Ganjil",
        summary: "",
        linkUrl: ""
      });
      const [gradeClassId, setGradeClassId] = useState("ALL");
      const [gradeDrafts, setGradeDrafts] = useState({});
      const [settingsForm, setSettingsForm] = useState(appState.settings);

      const showToast = useCallback((text, type = "info") => {
        setToast({ text, type });
      }, []);

      useEffect(() => {
        if (!toast) return;
        const t = setTimeout(() => setToast(null), 3000);
        return () => clearTimeout(t);
      }, [toast]);

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEYS.APP_STATE, JSON.stringify(appState));
        } catch (e) {}
      }, [appState]);

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEYS.SYNC_QUEUE, JSON.stringify(syncQueue));
        } catch (e) {}
      }, [syncQueue]);

      useEffect(() => {
        setSettingsForm(appState.settings);
      }, [appState.settings]);

      useEffect(() => {
        if (!selectedMeetingId && appState.meetings.length > 0) {
          setSelectedMeetingId(appState.meetings[0].id);
        }
      }, [appState.meetings, selectedMeetingId]);

      const sendToGas = useCallback(async (action, data = {}) => {
        const url = String(DEFAULT_GAS_WEBAPP_URL || "").trim();
        if (!url) throw new Error("DEFAULT_GAS_WEBAPP_URL kosong");
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action, data })
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const json = await res.json();
        if (!json.ok) throw new Error(json.error || "Respons GAS gagal");
        return json;
      }, []);

      const enqueueSync = useCallback((action, data) => {
        const url = String(DEFAULT_GAS_WEBAPP_URL || "").trim();
        if (!url) {
          setSyncStatus({ state: "offline", message: "Lokal saja (URL GAS kosong)" });
          return;
        }
        const job = {
          jobId: `${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
          action,
          data,
          createdAt: Date.now()
        };
        setSyncQueue((prev) => [...prev, job]);
      }, []);

      const flushQueue = useCallback(async () => {
        const url = String(DEFAULT_GAS_WEBAPP_URL || "").trim();
        if (!url || isFlushingRef.current || syncQueue.length === 0) return;

        isFlushingRef.current = true;
        setSyncStatus({ state: "syncing", message: `Sinkron (${syncQueue.length})...` });

        try {
          const snapshot = [...syncQueue];
          const pending = [];

          for (let i = 0; i < snapshot.length; i++) {
            const job = snapshot[i];
            try {
              await sendToGas(job.action, job.data);
            } catch (err) {
              pending.push(job, ...snapshot.slice(i + 1));
              throw err;
            }
          }

          setSyncQueue(pending);
          setSyncStatus({ state: "synced", message: `Tersinkron (${nowTimeStr()})` });
        } catch (err) {
          setSyncStatus({ state: "error", message: "Antrean tertunda" });
        } finally {
          isFlushingRef.current = false;
        }
      }, [syncQueue, sendToGas]);

      useEffect(() => {
        if (syncQueue.length > 0 && DEFAULT_GAS_WEBAPP_URL) {
          const t = setTimeout(() => flushQueue(), 100);
          return () => clearTimeout(t);
        } else if (syncQueue.length === 0 && DEFAULT_GAS_WEBAPP_URL) {
          setSyncStatus((prev) =>
            prev.state === "syncing" ? { state: "synced", message: `Tersinkron (${nowTimeStr()})` } : prev
          );
        }
      }, [syncQueue, flushQueue]);

      const pullFromSpreadsheet = useCallback(async (showFeedback = false) => {
        const url = String(DEFAULT_GAS_WEBAPP_URL || "").trim();
        if (!url) {
          if (showFeedback) showToast("Isi DEFAULT_GAS_WEBAPP_URL di index.html terlebih dahulu.", "error");
          return;
        }
        setSyncStatus({ state: "syncing", message: "Memuat Sheets..." });
        try {
          const res = await fetch(`${url}?action=getAllData&_t=${Date.now()}`);
          const json = await res.json();
          if (!json.ok || !json.data) throw new Error(json.error || "Gagal memuat data");
          const d = json.data;
          setAppState((prev) => ({
            settings: { ...INITIAL_STATE.settings, ...(d.settings || prev.settings) },
            classes: Array.isArray(d.classes) ? d.classes : [],
            students: Array.isArray(d.students) ? d.students : [],
            meetings: Array.isArray(d.meetings) ? d.meetings : [],
            materials: Array.isArray(d.materials) ? d.materials : [],
            attendance: Array.isArray(d.attendance) ? d.attendance : [],
            grades: Array.isArray(d.grades) ? d.grades : []
          }));
          setSyncStatus({ state: "synced", message: `Terhubung (${nowTimeStr()})` });
          if (showFeedback) showToast("Data berhasil dimuat dari Google Sheets.", "success");
        } catch (err) {
          setSyncStatus({ state: "error", message: "Gagal memuat Sheets" });
          if (showFeedback) showToast(`Gagal memuat dari Sheets: ${err.message}`, "error");
        }
      }, [showToast]);

      useEffect(() => {
        if (DEFAULT_GAS_WEBAPP_URL) {
          pullFromSpreadsheet(false);
        }
      }, [pullFromSpreadsheet]);

      const existingAttendanceKeys = useMemo(() => {
        const set = new Set();
        appState.attendance.forEach((row) => {
          set.add(makeDedupKey(row.date, row.meetingId, row.studentId, row.nis));
        });
        return set;
      }, [appState.attendance]);

      const registerAttendance = useCallback((rawPayload) => {
        const targetDate = normalizeRowDate(rawPayload.date || scanDate || todayISO());
        const meetingObj = appState.meetings.find((m) => m.id === (rawPayload.meetingId || selectedMeetingId));
        const meetingId = meetingObj ? meetingObj.id : (rawPayload.meetingId || "GENERAL");
        const meetingTitle = meetingObj ? meetingObj.title : (rawPayload.meetingTitle || "Pertemuan Reguler");

        let student = appState.students.find((s) => String(s.id) === String(rawPayload.studentId || "").trim());
        if (!student && (rawPayload.nis || rawPayload.code)) {
          const lookup = String(rawPayload.nis || rawPayload.code).trim().toLowerCase();
          student = appState.students.find(
            (s) => String(s.nis).trim().toLowerCase() === lookup || String(s.id).trim().toLowerCase() === lookup
          );
        }

        if (!student) {
          playScanTone("error");
          const msg = `Kode / NIS "${rawPayload.code || rawPayload.nis || rawPayload.studentId}" tidak ditemukan.`;
          setLastScanAlert({ type: "error", title: "Siswa Tidak Ditemukan", detail: msg });
          showToast(msg, "error");
          return { ok: false, reason: "NOT_FOUND" };
        }

        const dedupKey = makeDedupKey(targetDate, meetingId, student.id, student.nis);
        const nowTs = Date.now();
        const lastScanTs = recentScanMapRef.current[dedupKey] || 0;

        if ((nowTs - lastScanTs) < 5000 || existingAttendanceKeys.has(dedupKey)) {
          playScanTone("duplicate");
          const msg = `${student.name} sudah tercatat pada ${targetDate} (${meetingTitle}).`;
          setLastScanAlert({
            type: "duplicate",
            title: "Scan Ganda Ditolak",
            detail: msg
          });
          showToast(`${student.name} sudah absen di pertemuan/hari ini!`, "warning");
          return { ok: false, reason: "DUPLICATE" };
        }

        recentScanMapRef.current[dedupKey] = nowTs;

        const cls = appState.classes.find((c) => c.id === student.classId);
        const record = {
          id: `ATT-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
          dedupKey,
          date: targetDate,
          meetingId,
          meetingTitle,
          studentId: student.id,
          nis: student.nis || "",
          studentName: student.name,
          classId: student.classId || "",
          className: cls ? cls.name : (student.className || "-"),
          status: rawPayload.status || "Hadir",
          method: rawPayload.method || "QR",
          note: rawPayload.note || "",
          scannedAt: `${targetDate} ${nowTimeStr()}`
        };

        // Optimistic update langsung agar tampilan instan
        setAppState((prev) => ({
          ...prev,
          attendance: [record, ...prev.attendance]
        }));

        playScanTone("success");
        setLastScanAlert({
          type: "success",
          title: `${student.name} — ${record.status}`,
          detail: `${record.className} • NIS ${record.nis || "-"} • ${meetingTitle}`
        });

        enqueueSync("recordAttendance", record);
        return { ok: true, record };
      }, [scanDate, selectedMeetingId, appState.meetings, appState.students, appState.classes, existingAttendanceKeys, enqueueSync, showToast]);

      useEffect(() => {
        if (!cameraActive || activeTab !== "scanner") {
          if (scannerHtml5Ref.current) {
            scannerHtml5Ref.current.stop().catch(() => {}).finally(() => {
              scannerHtml5Ref.current = null;
            });
          }
          return;
        }

        const readerId = "absensiku-qr-reader";
        if (!window.Html5Qrcode) {
          showToast("Pemindai kamera tidak tersedia.", "error");
          setCameraActive(false);
          return;
        }

        const scanner = new window.Html5Qrcode(readerId);
        scannerHtml5Ref.current = scanner;

        scanner.start(
          { facingMode: "environment" },
          { fps: 12, qrbox: { width: 230, height: 230 } },
          (decodedText) => {
            if (processingScanRef.current) return;
            processingScanRef.current = true;
            try {
              let parsed = {};
              try {
                parsed = JSON.parse(decodedText);
              } catch (_) {
                parsed = { code: decodedText };
              }
              registerAttendance({
                studentId: parsed.studentId || parsed.id || "",
                nis: parsed.nis || "",
                code: parsed.code || decodedText,
                method: "QR"
              });
            } finally {
              setTimeout(() => {
                processingScanRef.current = false;
              }, 700);
            }
          },
          () => {}
        ).catch(() => {
          showToast("Kamera gagal dibuka. Gunakan input NIS/Manual.", "error");
          setCameraActive(false);
        });

        return () => {
          scanner.stop().catch(() => {});
        };
      }, [cameraActive, activeTab, registerAttendance, showToast]);

      const handleSaveClass = (e) => {
        e.preventDefault();
        if (!classForm.name.trim()) return;
        const id = classForm.id || `CLS-${Date.now().toString().slice(-6)}`;
        const item = {
          id,
          name: classForm.name.trim(),
          gradeLevel: classForm.gradeLevel,
          homeroomTeacher: classForm.homeroomTeacher.trim(),
          createdAt: todayISO()
        };
        setAppState((prev) => {
          const exists = prev.classes.some((c) => c.id === id);
          const updatedClasses = exists
            ? prev.classes.map((c) => (c.id === id ? item : c))
            : [...prev.classes, item];
          const updatedStudents = prev.students.map((s) =>
            s.classId === id ? { ...s, className: item.name } : s
          );
          return { ...prev, classes: updatedClasses, students: updatedStudents };
        });
        enqueueSync("upsertClass", item);
        setClassForm({ id: "", name: "", gradeLevel: "8", homeroomTeacher: "" });
        showToast("Kelas disimpan.", "success");
      };

      const handleDeleteClass = (id) => {
        setAppState((prev) => ({ ...prev, classes: prev.classes.filter((c) => c.id !== id) }));
        enqueueSync("deleteClass", { id });
        showToast("Kelas dihapus.", "info");
      };

      const handleSaveStudent = (e) => {
        e.preventDefault();
        if (!studentForm.name.trim()) return;
        const cls = appState.classes.find((c) => c.id === studentForm.classId);
        const id = studentForm.id || `STD-${Date.now().toString().slice(-6)}`;
        const item = {
          id,
          nis: studentForm.nis.trim(),
          name: studentForm.name.trim(),
          gender: studentForm.gender,
          classId: cls ? cls.id : "",
          className: cls ? cls.name : "",
          createdAt: todayISO()
        };
        setAppState((prev) => {
          const exists = prev.students.some((s) => s.id === id);
          const updated = exists ? prev.students.map((s) => (s.id === id ? item : s)) : [...prev.students, item];
          return { ...prev, students: updated };
        });
        enqueueSync("upsertStudent", item);
        setStudentForm({ id: "", nis: "", name: "", gender: "L", classId: studentForm.classId });
        showToast("Data siswa disimpan.", "success");
      };

      const handleDeleteStudent = (id) => {
        setAppState((prev) => ({ ...prev, students: prev.students.filter((s) => s.id !== id) }));
        enqueueSync("deleteStudent", { id });
        showToast("Siswa dihapus.", "info");
      };

      const handleImportExcelStudents = (e) => {
        const file = e.target.files?.[0];
        if (!file || !window.XLSX) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const wb = window.XLSX.read(evt.target.result, { type: "binary" });
            const ws = wb.Sheets[wb.SheetNames[0]];
            const rows = window.XLSX.utils.sheet_to_json(ws);
            const existingNis = new Set(appState.students.map((s) => String(s.nis || "").trim()));
            const addedList = [];

            rows.forEach((r, idx) => {
              const name = String(r.Nama || r.nama || r.Name || r.name || "").trim();
              const nis = String(r.NIS || r.nis || "").trim();
              const genderRaw = String(r.JK || r.jk || r.Gender || r.gender || "L").trim().toUpperCase();
              const gender = genderRaw.startsWith("P") || genderRaw.startsWith("F") ? "P" : "L";
              const classLabel = String(r.Kelas || r.kelas || r.Class || r.class || "").trim();
              const matchedClass = appState.classes.find(
                (c) => c.name.toLowerCase() === classLabel.toLowerCase() || c.id === classLabel
              );
              if (!name || (nis && existingNis.has(nis))) return;
              if (nis) existingNis.add(nis);
              addedList.push({
                id: `STD-${Date.now()}-${idx}`,
                nis,
                name,
                gender,
                classId: matchedClass ? matchedClass.id : "",
                className: matchedClass ? matchedClass.name : classLabel,
                createdAt: todayISO()
              });
            });

            if (addedList.length === 0) {
              showToast("Tidak ada siswa baru untuk diimpor.", "warning");
              return;
            }
            setAppState((prev) => ({ ...prev, students: [...prev.students, ...addedList] }));
            enqueueSync("bulkImportStudents", { students: addedList });
            showToast(`${addedList.length} siswa diimpor.`, "success");
          } catch (err) {
            showToast("Gagal membaca file Excel/CSV.", "error");
          } finally {
            e.target.value = "";

        };
        reader.readAsBinaryString(file);

                      <label className="block text-xs text-slate-400 mb-1">Semester</label>
                      <select
                        value={settingsForm.semester}
                        onChange={(e) => setSettingsForm({ ...settingsForm, semester: e.target.value })}
                        className="w-full rounded-xl border border-slate-700 bg-slate-950 px-3 py-2 text-xs text-white"
                      >
                        <option value="Ganjil">Ganjil</option>
                        <option value="Genap">Genap</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs text-slate-400 mb-1">Tahun Ajaran</label>
                      <input
                        type="text"
                        value={settingsForm.academicYear}
                        onChange={(e) => setSettingsForm({ ...settingsForm, academicYear: e.target.value })}
                        className="w-full rounded-xl border border-slate-700 bg-slate-950 px-3 py-2 text-xs text-white"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-3">
                    <div>
                      <label className="block text-xs text-slate-400 mb-1">Bobot Harian (%)</label>
                      <input
                        type="number"
                        value={settingsForm.weightDaily}
                        onChange={(e) => setSettingsForm({ ...settingsForm, weightDaily: e.target.value })}
                        className="w-full rounded-xl border border-slate-700 bg-slate-950 px-3 py-2 text-xs text-white"
                      />
                    </div>
                    <div>
                      <label className="block text-xs text-slate-400 mb-1">Bobot UTS (%)</label>
                      <input
                        type="number"
                        value={settingsForm.weightUts}
                        onChange={(e) => setSettingsForm({ ...settingsForm, weightUts: e.target.value })}
                        className="w-full rounded-xl border border-slate-700 bg-slate-950 px-3 py-2 text-xs text-white"
                      />
                    </div>
                    <div>
                      <label className="block text-xs text-slate-400 mb-1">Bobot UAS (%)</label>
                      <input
                        type="number"
                        value={settingsForm.weightUas}
                        onChange={(e) => setSettingsForm({ ...settingsForm, weightUas: e.target.value })}
                        className="w-full rounded-xl border border-slate-700 bg-slate-950 px-3 py-2 text-xs text-white"
                      />
                    </div>
                  </div>

                  <button
                    type="submit"
                    className="rounded-xl bg-indigo-600 px-4 py-2 text-xs font-semibold text-white hover:bg-indigo-500"
                  >
                    Simpan Pengaturan
                  </button>
                </form>

                <div className="lg:col-span-5 space-y-4 rounded-2xl border border-rose-900/50 bg-slate-900/70 p-5 h-fit">
                  <h2 className="text-base font-semibold text-rose-300">Manajemen Data</h2>
                  <button
                    type="button"
                    onClick={handleClearAllData}
                    className="rounded-xl bg-rose-600 px-4 py-2 text-xs font-semibold text-white hover:bg-rose-500"
                  >
                    Kosongkan Semua Data
                  </button>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
