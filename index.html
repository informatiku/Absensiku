    const getTodayDate = () => {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;

    const getCurrentTime = () => new Date().toTimeString().slice(0, 8);

    // --- QR Code Display Component ---
    function QRCodeDisplay({ value, size = 122 }) {
      const canvasRef = useRef(null);

      useEffect(() => {
        if (window.QRCode && canvasRef.current && value) {
          window.QRCode.toCanvas(
            canvasRef.current,
            value,
            {
              width: size,
              margin: 1,
              color: { dark: "#0B1120", light: "#FFFFFF" }
            },
            () => {}
          );
        }
      }, [value, size]);

      return (
        <div className="inline-flex items-center justify-center bg-white p-1.5 rounded-xl shadow-sm">
          <canvas ref={canvasRef} width={size} height={size} className="block" />
        </div>
      );
    }

    // --- Main Application ---
    function App() {
      const [isAuthenticated, setIsAuthenticated] = useState(
        () => localStorage.getItem("absensiku_auth") === "true"
      );
      const [teacher, setTeacher] = useState(() => {
        const saved = localStorage.getItem("absensiku_teacher");
        return saved ? JSON.parse(saved) : INITIAL_TEACHER;
      });
      const [gasUrl] = useState(
        () => localStorage.getItem("https://script.google.com/macros/s/AKfycbxbg0YQVlUA4Vb2YofhyWYqX_UZWN87VfGFDrhyG4USabB_71rTp3tpsj9e62udWbl7UQ/exec") || DEFAULT_GAS_WEBAPP_URL
        () => localStorage.getItem("") || DEFAULT_GAS_WEBAPP_URL
      );
      const [syncing, setSyncing] = useState(false);

      const [activeMenu, setActiveMenu] = useState("dashboard");
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

      const [classes, setClasses] = useState(() => {
        const saved = localStorage.getItem("absensiku_classes_v2");
        return saved ? JSON.parse(saved) : [];
      });
      const [students, setStudents] = useState(() => {
        const saved = localStorage.getItem("absensiku_students_v2");
        return saved ? JSON.parse(saved) : [];
      });
      const [attendance, setAttendance] = useState(() => {
        const saved = localStorage.getItem("absensiku_attendance_v2");
        return saved ? JSON.parse(saved) : [];
      });
      const [grades, setGrades] = useState(() => {
        const saved = localStorage.getItem("absensiku_grades_v2");
        return saved ? JSON.parse(saved) : {};
      });
      const [gradeWeights, setGradeWeights] = useState(() => {
        const saved = localStorage.getItem("absensiku_grade_weights");
        return saved ? JSON.parse(saved) : DEFAULT_GRADE_WEIGHTS;
      });
      const [meetings, setMeetings] = useState(() => {
        const saved = localStorage.getItem("absensiku_meetings");
        return saved ? JSON.parse(saved) : INITIAL_MEETINGS;
      });
      const [materials, setMaterials] = useState(() => {
        const saved = localStorage.getItem("absensiku_materials_v2");
        return saved ? JSON.parse(saved) : [];
      });

      const [toast, setToast] = useState(null);
      const showToast = (type, title, message) => {
        setToast({ type, title, message, id: Date.now() });
      };

      useEffect(() => {
        if (!toast) return;
        const t = setTimeout(() => setToast(null), 4000);
        return () => clearTimeout(t);
      }, [toast]);

      useEffect(() => localStorage.setItem("absensiku_teacher", JSON.stringify(teacher)), [teacher]);
      useEffect(() => localStorage.setItem("absensiku_classes_v2", JSON.stringify(classes)), [classes]);
      useEffect(() => localStorage.setItem("absensiku_students_v2", JSON.stringify(students)), [students]);
      useEffect(() => localStorage.setItem("absensiku_attendance_v2", JSON.stringify(attendance)), [attendance]);
      useEffect(() => localStorage.setItem("absensiku_grades_v2", JSON.stringify(grades)), [grades]);
      useEffect(() => localStorage.setItem("absensiku_grade_weights", JSON.stringify(gradeWeights)), [gradeWeights]);
      useEffect(() => localStorage.setItem("absensiku_meetings", JSON.stringify(meetings)), [meetings]);
      useEffect(() => localStorage.setItem("absensiku_materials_v2", JSON.stringify(materials)), [materials]);

      // Helper: Sinkronisasi dengan Google Apps Script (Code.gs) jika URL diisi
      const callGasPost = async (action, payload) => {
        if (!gasUrl || !gasUrl.startsWith("http")) return null;
        try {
          setSyncing(true);
          const res = await fetch(gasUrl, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ action, payload })
          });
          return await res.json();
        } catch (err) {
          console.warn("Offline / fallback local:", err);
          return null;
        } finally {
          setSyncing(false);
        }
      };

      const syncFromGoogleSheets = async (targetUrl = gasUrl) => {
        if (!targetUrl || !targetUrl.startsWith("http")) return false;
        try {
          setSyncing(true);
          const res = await fetch(`${targetUrl}?action=getAll`);
          const json = await res.json();
          if (json && json.success && json.data) {
            const d = json.data;
            if (d.teacher) {
              setTeacher((prev) => ({
                ...prev,
                id: d.teacher.ID || prev.id,
                name: d.teacher.Nama_Guru || prev.name,
                nip: d.teacher.NIP || prev.nip,
                email: d.teacher.Email || prev.email,
                password: d.teacher.Password || prev.password,
                subject: d.teacher.Mata_Pelajaran || prev.subject,
                school: d.teacher.Sekolah || prev.school,
                academicYear: d.teacher.Tahun_Ajaran || prev.academicYear,
                semester: d.teacher.Semester || prev.semester
              }));
              setGradeWeights({
                harian: Number(d.teacher.Bobot_Harian ?? 40),
                uts: Number(d.teacher.Bobot_UTS ?? 30),
                uas: Number(d.teacher.Bobot_UAS ?? 30)
              });
            }
            if (Array.isArray(d.classes)) {
              setClasses(
                d.classes.map((c) => ({
                  id: c.ID,
                  name: c.Nama_Kelas,
                  grade: c.Tingkat,
                  waliKelas: c.Wali_Kelas,
                  room: c.Ruang_Lab
                }))
              );
            }
            if (Array.isArray(d.students)) {
              setStudents(
                d.students.map((s) => ({
                  id: s.ID,
                  nis: String(s.NIS),
                  name: s.Nama_Lengkap,
                  gender: s.Jenis_Kelamin,
                  className: s.Kelas,
                  qrCode: s.QR_Code || `SMPN2CKJ-${s.NIS}`
                }))
              );
            }
            if (Array.isArray(d.meetings) && d.meetings.length > 0) {
              setMeetings(d.meetings.map((m) => m.Nama_Pertemuan));
            }
            if (Array.isArray(d.materials)) {
              setMaterials(
                d.materials.map((m) => ({
                  id: m.ID,
                  title: m.Judul_Materi,
                  grade: m.Tingkat_Kelas,
                  meeting: m.Pertemuan,
                  summary: m.Ringkasan,
                  content: m.Pokok_Bahasan,
                  resourceLink: m.Tautan_Modul,
                  updatedAt: String(m.Updated_At || "").slice(0, 10)
                }))
              );
            }
            if (Array.isArray(d.attendance)) {
              setAttendance(
                d.attendance.map((a) => ({
                  id: a.ID,
                  studentId: a.Student_ID,
                  nis: String(a.NIS),
                  studentName: a.Nama_Siswa,
                  className: a.Kelas,
                  subject: a.Mata_Pelajaran,
                  meeting: a.Pertemuan,
                  date: String(a.Tanggal).slice(0, 10),
                  time: String(a.Jam_Masuk),
                  status: a.Status_Kehadiran,
                  note: a.Keterangan
                }))
              );
            }
            if (Array.isArray(d.grades)) {
              const gMap = {};
              d.grades.forEach((g) => {
                gMap[g.Student_ID] = {
                  harian: Number(g.Nilai_Harian || 0),
                  uts: Number(g.Nilai_UTS || 0),
                  uas: Number(g.Nilai_UAS || 0)
                };
              });
              setGrades(gMap);
            }
            return true;
          }
          return false;
        } catch (err) {
          return false;
        } finally {
          setSyncing(false);
        }
      };

      useEffect(() => {
        if (isAuthenticated && gasUrl) {
          syncFromGoogleSheets(gasUrl);
        }
      }, [isAuthenticated]);

      const playBeep = (success = true) => {
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          const ctx = new AudioCtx();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = success ? "sine" : "sawtooth";
          osc.frequency.setValueAtTime(success ? 880 : 240, ctx.currentTime);
          if (success) osc.frequency.setValueAtTime(1174.66, ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
          osc.start();
          osc.stop(ctx.currentTime + 0.25);
        } catch (e) {}
      };

      const handleLogin = async (email, password) => {
        if (gasUrl && gasUrl.startsWith("http")) {

              <div className="mb-4 p-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs">

    // =========================================================================
    // 1. DASHBOARD GURU (GRAFIK BATANG)
    // =========================================================================
    function DashboardView({ students, classes, attendance, teacher, onNavigate }) {
      const today = getTodayDate();
      const todayRecords = attendance.filter((a) => a.date === today);
      const activeRecords = todayRecords.length > 0 ? todayRecords : attendance;

      const countHadir = activeRecords.filter((a) => a.status === "Hadir").length;
      const countIzin = activeRecords.filter((a) => a.status === "Izin").length;
      const countSakit = activeRecords.filter((a) => a.status === "Sakit").length;
      const countAlfa = activeRecords.filter((a) => a.status === "Alfa").length;
      const attendancePct =
        activeRecords.length > 0 ? Math.round((countHadir / activeRecords.length) * 100) : 0;

      const metrics = [
        { label: "Total Siswa", value: students.length, color: "text-blue-400" },
        { label: "Total Kelas", value: classes.length, color: "text-indigo-400" },
        { label: "Siswa Hadir", value: countHadir, color: "text-emerald-400" },
        { label: "Siswa Izin", value: countIzin, color: "text-amber-400" },
        { label: "Siswa Sakit", value: countSakit, color: "text-sky-400" },
        { label: "Siswa Alfa", value: countAlfa, color: "text-rose-400" },
        { label: "Persentase Kehadiran", value: `${attendancePct}%`, color: "text-cyan-400" }
      ];

      const classStats = classes.map((cls) => {
        const clsStudents = students.filter((s) => s.className === cls.name);
        const clsAtt = activeRecords.filter((a) => a.className === cls.name && a.status === "Hadir");
        const pct =
          clsStudents.length > 0
            ? Math.min(100, Math.round((clsAtt.length / clsStudents.length) * 100))
            : 0;
        return { name: cls.name, total: clsStudents.length, hadir: clsAtt.length, pct };
      });

      return (
        <div className="space-y-6">
          <div className="p-6 rounded-2xl bg-[#0F172A] border border-slate-800 flex flex-col md:flex-row items-start md:items-center justify-between gap-4 shadow-xl">
            <div>
              <span className="text-xs font-semibold text-blue-400 uppercase tracking-wider">
                Dashboard Guru • {teacher.school}
              </span>
              <h3 className="text-xl font-bold text-white mt-1">Selamat Datang, {teacher.name}</h3>
              <p className="text-xs text-slate-400 mt-1">
                Sistem Absensi Digital QR Code Mata Pelajaran {teacher.subject}.
              </p>
            </div>

              onClick={() => onNavigate("scanner")}
              className="px-4 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold flex items-center gap-2"

              <Icons.QrCode className="w-4 h-4" />
              Buka Sesi Absensi QR
            </button>
          </div>

          <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">
            {metrics.map((m, idx) => (
              <div key={idx} className="p-5 rounded-2xl bg-[#0F172A] border border-slate-800 shadow-lg">
                <p className={`text-2xl sm:text-3xl font-extrabold ${m.color}`}>{m.value}</p>
                <p className="text-xs text-slate-400 font-medium mt-1">{m.label}</p>
              </div>
            ))}
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            {/* Grafik Batang Vertikal */}
            <div className="lg:col-span-2 p-6 rounded-2xl bg-[#0F172A] border border-slate-800 shadow-xl flex flex-col justify-between">
              <div className="flex items-center justify-between mb-6">
                <div>
                  <h4 className="text-base font-bold text-white">Grafik Batang Kehadiran per Kelas</h4>
                  <p className="text-xs text-slate-400">Persentase kehadiran mata pelajaran Informatika</p>
                </div>
              </div>

              <div className="relative pt-4 pb-2">
                <div className="h-56 flex flex-col justify-between pointer-events-none">
                  {[100, 75, 50, 25, 0].map((tick) => (
                    <div key={tick} className="flex items-center gap-3 w-full">
                      <span className="text-[10px] font-mono text-slate-500 w-8 text-right shrink-0">
                        {tick}%
                      </span>
                      <div className="flex-1 border-b border-dashed border-slate-800" />
                    </div>
                  ))}
                </div>

                <div className="absolute inset-x-0 top-4 bottom-2 pl-11 pr-2 flex items-end justify-around gap-3">
                  {classStats.length === 0 && (
                    <p className="text-xs text-slate-500 m-auto">
                      Tambahkan data kelas & siswa untuk melihat grafik batang.
                    </p>
                  )}
                  {classStats.map((item) => (
                    <div
                      key={item.name}
                      className="flex-1 max-w-[68px] h-full flex flex-col items-center justify-end"

                      <p className="text-xs font-semibold text-white truncate">{item.studentName}</p>
                      <p className="text-[11px] text-slate-400">

                ))}
                {attendance.length === 0 && (
                  <p className="text-xs text-slate-500 text-center py-6">Belum ada data absensi.</p>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 2. DATA SISWA & KARTU PELAJAR QR (85.6mm x 54mm, BARCODE BESAR)
    // =========================================================================
    function StudentsView({ students, setStudents, classes, teacher, callGasPost, showToast }) {
      const [search, setSearch] = useState("");
      const [filterClass, setFilterClass] = useState("ALL");
      const [modalOpen, setModalOpen] = useState(false);
      const [editingStudent, setEditingStudent] = useState(null);
      const [qrModalStudent, setQrModalStudent] = useState(null);
      const [batchPrintOpen, setBatchPrintOpen] = useState(false);
      const [batchClass, setBatchClass] = useState(classes[0]?.name || "7A");
      const [formData, setFormData] = useState({
        name: "",
        nis: "",
        gender: "L",
        className: classes[0]?.name || "7A"
      });
      const fileInputRef = useRef(null);

      const filteredStudents = useMemo(() => {
        return students.filter((s) => {
          const matchClass = filterClass === "ALL" || s.className === filterClass;
          const q = search.toLowerCase();
          return (
            matchClass &&
            (s.name.toLowerCase().includes(q) ||
              s.nis.toLowerCase().includes(q) ||
              s.className.toLowerCase().includes(q))
          );
        });
      }, [students, filterClass, search]);

      const openAddModal = () => {
        setEditingStudent(null);
        setFormData({
          name: "",
          nis: "",
          gender: "L",
          className: filterClass !== "ALL" ? filterClass : classes[0]?.name || "7A"
        });
        setModalOpen(true);
      };

      const handleSaveStudent = async (e) => {
        e.preventDefault();
        const cleanNis = formData.nis.trim();
        const cleanName = formData.name.trim();
        if (!cleanNis || !cleanName) return;

        if (students.some((s) => s.nis === cleanNis && s.id !== editingStudent?.id)) {
          showToast("error", "NIS Duplikat", `NIS ${cleanNis} sudah terdaftar.`);
          return;
        }

        const qrCode = `SMPN2CKJ-${cleanNis}`;
        if (editingStudent) {
          setStudents((prev) =>
            prev.map((s) =>
              s.id === editingStudent.id
                ? { ...s, name: cleanName, nis: cleanNis, gender: formData.gender, className: formData.className, qrCode }
                : s
            )
          );
          await callGasPost("saveStudent", {
            id: editingStudent.id,
            nis: cleanNis,
            name: cleanName,
            gender: formData.gender,
            className: formData.className
          });
          showToast("success", "Data Diperbarui", `Siswa ${cleanName} berhasil diperbarui.`);
        } else {
          const newStudent = {
            id: `STD-${Date.now()}`,
            nis: cleanNis,
            name: cleanName,
            gender: formData.gender,
            className: formData.className,
            qrCode
          };
          setStudents((prev) => [newStudent, ...prev]);
          await callGasPost("saveStudent", newStudent);
          showToast("success", "Siswa Ditambahkan", `${cleanName} berhasil ditambahkan.`);
        }
        setModalOpen(false);
      };

      const handleDeleteStudent = async (st) => {
        setStudents((prev) => prev.filter((s) => s.id !== st.id));
        await callGasPost("deleteStudent", { id: st.id });
        showToast("warning", "Siswa Dihapus", `Data ${st.name} dihapus.`);
      };

      const handleImportExcel = (e) => {
        const file = e.target.files?.[0];
        if (!file || !window.XLSX) return;
        const reader = new FileReader();
        reader.onload = async (evt) => {
          try {
            const wb = window.XLSX.read(evt.target.result, { type: "binary" });
            const rows = window.XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
            const existingNis = new Set(students.map((s) => String(s.nis)));
            const imported = [];

            rows.forEach((row, idx) => {
              const name = String(row["Nama"] || row["Nama Lengkap"] || row["nama"] || "").trim();
              const nis = String(row["NIS"] || row["nis"] || "").trim();
              const jk = String(row["Jenis Kelamin"] || row["JK"] || "L").trim().toUpperCase();
              const className = String(row["Kelas"] || row["kelas"] || classes[0]?.name || "7A").trim();
              if (name && nis && !existingNis.has(nis)) {
                existingNis.add(nis);
                imported.push({
                  id: `STD-${Date.now()}-${idx}`,
                  nis,
                  name,
                  gender: jk.startsWith("P") ? "P" : "L",
                  className,
                  qrCode: `SMPN2CKJ-${nis}`
                });
              }
            });

            if (imported.length > 0) {
              setStudents((prev) => [...imported, ...prev]);
              await callGasPost("importStudentsBatch", { students: imported });
              showToast("success", "Impor Berhasil", `${imported.length} siswa baru berhasil diimpor.`);
            } else {
              showToast("warning", "Tidak Ada Data Baru", "Periksa format kolom Excel (Nama, NIS, JK, Kelas).");
            }
          } catch (err) {
            showToast("error", "Gagal Impor", "File Excel tidak valid.");
          }
          e.target.value = "";
        };
        reader.readAsBinaryString(file);
      };

      const batchStudents = useMemo(
        () => students.filter((s) => s.className === batchClass),
        [students, batchClass]
      );

      return (
        <div className="space-y-6">
          <div className="p-5 rounded-2xl bg-[#0F172A] border border-slate-800 flex flex-col lg:flex-row lg:items-center justify-between gap-4 shadow-xl">
            <div className="flex flex-col sm:flex-row gap-3 flex-1">
              <div className="relative flex-1 max-w-md">
                <Icons.Search className="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2" />
                <input
                  type="text"
                  value={search}
                  onChange={(e) => setSearch(e.target.value)}
                  placeholder="Cari nama siswa atau NIS..."
                  className="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-xs sm:text-sm text-white"
                />
              </div>
              <select
                value={filterClass}
                onChange={(e) => setFilterClass(e.target.value)}
                className="px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-xs sm:text-sm text-white"
              >
                <option value="ALL">Semua Kelas ({students.length})</option>
                {classes.map((c) => (
                  <option key={c.id} value={c.name}>
                    Kelas {c.name}
                  </option>
                ))}
              </select>
            </div>

            <div className="flex flex-wrap items-center gap-2">
              <input ref={fileInputRef} type="file" accept=".xlsx,.xls,.csv" onChange={handleImportExcel} className="hidden" />
              <button
                onClick={() => {
                  setBatchClass(filterClass !== "ALL" ? filterClass : classes[0]?.name || "7A");
                  setBatchPrintOpen(true);
                }}
                className="px-3.5 py-2.5 rounded-xl bg-indigo-600/20 hover:bg-indigo-600/30 text-indigo-300 border border-indigo-500/30 text-xs font-semibold flex items-center gap-2"
              >
                <Icons.Printer className="w-4 h-4" />
                Cetak Kartu QR per Kelas
              </button>
              <button
                onClick={() => fileInputRef.current?.click()}
                className="px-3.5 py-2.5 rounded-xl bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-300 border border-emerald-500/30 text-xs font-semibold flex items-center gap-2"
              >
                <Icons.Upload className="w-4 h-4" />
                Impor Excel
              </button>
              <button
                onClick={openAddModal}
                className="px-4 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold flex items-center gap-2"
              >
                <Icons.Plus className="w-4 h-4" />
                Tambah Siswa
              </button>
            </div>
          </div>

          <div className="rounded-2xl bg-[#0F172A] border border-slate-800 overflow-hidden shadow-xl">
            <div className="overflow-x-auto">
              <table className="w-full text-left border-collapse">
                <thead>
                  <tr className="bg-slate-900 border-b border-slate-800 text-[11px] uppercase text-slate-400">
                    <th className="py-3.5 px-4">No</th>
                    <th className="py-3.5 px-4">Nama Lengkap</th>
                    <th className="py-3.5 px-4">NIS</th>
                    <th className="py-3.5 px-4">Jenis Kelamin</th>
                    <th className="py-3.5 px-4">Kelas</th>
                    <th className="py-3.5 px-4">QR Code</th>
                    <th className="py-3.5 px-4 text-right">Aksi</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800 text-xs sm:text-sm">
                  {filteredStudents.map((s, idx) => (
                    <tr key={s.id} className="hover:bg-slate-800/40">
                      <td className="py-3.5 px-4 text-slate-400">{idx + 1}</td>
                      <td className="py-3.5 px-4 font-semibold text-white">{s.name}</td>
                      <td className="py-3.5 px-4 font-mono text-slate-300">{s.nis}</td>
                      <td className="py-3.5 px-4 text-slate-300">{s.gender === "L" ? "Laki-laki" : "Perempuan"}</td>
                      <td className="py-3.5 px-4">
                        <span className="px-2.5 py-1 rounded-lg bg-blue-500/15 text-blue-400 text-xs font-semibold">
                          {s.className}
                        </span>
                      </td>
                      <td className="py-3.5 px-4">
                        <button
                          onClick={() => setQrModalStudent(s)}
                          className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium"
                        >
                          <Icons.QrCode className="w-3.5 h-3.5 text-blue-400" />
                          Lihat QR
                        </button>
                      </td>
                      <td className="py-3.5 px-4 text-right">
                        <div className="inline-flex items-center gap-1.5">
                          <button
                            onClick={() => {
                              setEditingStudent(s);
                              setFormData({ name: s.name, nis: s.nis, gender: s.gender, className: s.className });
                              setModalOpen(true);
                            }}
                            className="p-2 rounded-lg bg-slate-800 text-slate-300 hover:text-blue-400"
                          >
                            <Icons.Edit className="w-4 h-4" />
                          </button>
                          <button
                            onClick={() => handleDeleteStudent(s)}
                            className="p-2 rounded-lg bg-slate-800 text-slate-300 hover:text-rose-400"
                          >
                            <Icons.Trash className="w-4 h-4" />
                          </button>
                        </div>
                      </td>
                    </tr>
                  ))}
                  {filteredStudents.length === 0 && (
                    <tr>
                      <td colSpan="7" className="py-10 text-center text-slate-500 text-sm">
                        Belum ada data siswa.
                      </td>
                    </tr>
                  )}
                </tbody>
              </table>
            </div>
          </div>

          {modalOpen && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="w-full max-w-md bg-[#0F172A] border border-slate-800 rounded-2xl p-6 shadow-2xl">
                <div className="flex items-center justify-between mb-4">
                  <h3 className="text-base font-bold text-white">
                    {editingStudent ? "Edit Data Siswa" : "Tambah Siswa Baru"}
                  </h3>
                  <button onClick={() => setModalOpen(false)} className="text-slate-400 hover:text-white">
                    <Icons.X className="w-5 h-5" />
                  </button>
                </div>
                <form onSubmit={handleSaveStudent} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1">Nama Lengkap</label>
                    <input
                      type="text"
                      required
                      value={formData.name}
                      onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                      className="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-sm text-white"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1">NIS</label>
                    <input
                      type="text"
                      required
                      value={formData.nis}
                      onChange={(e) => setFormData({ ...formData, nis: e.target.value })}
                      className="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-sm text-white"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1">Jenis Kelamin</label>
                      <select
                        value={formData.gender}
                        onChange={(e) => setFormData({ ...formData, gender: e.target.value })}
                        className="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-sm text-white"
                      >
                        <option value="L">Laki-laki</option>
                        <option value="P">Perempuan</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1">Kelas</label>
                      <select
                        value={formData.className}
                        onChange={(e) => setFormData({ ...formData, className: e.target.value })}
                        className="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-sm text-white"
                      >
                        {classes.map((c) => (
                          <option key={c.id} value={c.name}>
                            {c.name}
                          </option>
                        ))}
                      </select>
                    </div>
                  </div>
                  <div className="flex justify-end gap-2 pt-3">
                    <button
                      type="button"
                      onClick={() => setModalOpen(false)}
                      className="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 text-xs font-semibold"
                    >
                      Batal
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 rounded-xl bg-blue-600 text-white text-xs font-semibold"
                    >
                      Simpan Data
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Single Student QR Card Modal */}
          {qrModalStudent && (
            <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="w-full max-w-md bg-[#0F172A] border border-slate-800 rounded-2xl p-6 shadow-2xl">
                <div className="flex items-center justify-between mb-4 no-print">
                  <div>
                    <h3 className="text-base font-bold text-white">Kartu Pelajar & QR Absensi</h3>
                    <p className="text-[11px] text-slate-400">Ukuran standar kartu pelajar: 85.6mm × 54mm</p>
                  </div>
                  <button onClick={() => setQrModalStudent(null)} className="text-slate-400 hover:text-white">
                    <Icons.X className="w-5 h-5" />
                  </button>
                </div>

                <div id="printable-area" className="flex justify-center my-2">
                  <div
                    style={{ width: "85.6mm", height: "54mm" }}
                    className="qr-id-card rounded-2xl bg-gradient-to-br from-slate-900 via-blue-950 to-slate-900 border border-blue-500/40 p-3 flex flex-col justify-between overflow-hidden"
                  >
                    <div className="border-b border-blue-400/25 pb-1 flex items-center justify-between">
                      <div>
                        <p className="text-[9px] font-extrabold uppercase text-blue-400 leading-none">{teacher.school}</p>
                        <p className="text-[9.5px] font-bold text-white mt-0.5">
                          KARTU ABSENSI {teacher.subject.toUpperCase()}
                        </p>
                      </div>
                      <span className="text-[8px] font-bold px-1.5 py-0.5 rounded bg-blue-500/20 text-blue-300">
                        {teacher.academicYear}
                      </span>
                    </div>

                    <div className="flex items-center justify-between gap-2.5 pt-0.5 flex-1">
                      <div className="flex-1 min-w-0 space-y-1">
                        <p className="text-[11.5px] font-bold text-white leading-snug line-clamp-2">
                          {qrModalStudent.name}
                        </p>
                        <p className="text-[10px] font-mono text-slate-300">NIS: {qrModalStudent.nis}</p>
                        <p className="text-[10px] text-slate-300">
                          JK: {qrModalStudent.gender === "L" ? "Laki-laki" : "Perempuan"}
                        </p>
                        <p className="text-[10.5px] text-blue-300 font-bold">Kelas: {qrModalStudent.className}</p>
                      </div>
                      <div className="shrink-0">
                        <QRCodeDisplay value={qrModalStudent.qrCode} size={122} />
                      </div>
                    </div>
                  </div>
                </div>

                <div className="flex justify-end gap-2 mt-5 no-print">
                  <button
                    onClick={() => setQrModalStudent(null)}
                    className="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 text-xs font-semibold"
                  >
                    Tutup
                  </button>
                  <button
                    onClick={() => window.print()}
                    className="px-4 py-2 rounded-xl bg-blue-600 text-white text-xs font-semibold flex items-center gap-2"
                  >
                    <Icons.Printer className="w-4 h-4" />
                    Cetak Kartu
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Batch Print Modal */}
          {batchPrintOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="w-full max-w-4xl max-h-[90vh] bg-[#0F172A] border border-slate-800 rounded-2xl flex flex-col shadow-2xl">
                <div className="p-5 border-b border-slate-800 flex flex-wrap items-center justify-between gap-3 no-print">
                  <div>
                    <h3 className="text-base font-bold text-white">Cetak Kartu QR per Kelas</h3>
                    <p className="text-xs text-slate-400">Ukuran kartu pelajar 85.6mm × 54mm</p>
                  </div>
                  <div className="flex items-center gap-2">
                    <select
                      value={batchClass}
                      onChange={(e) => setBatchClass(e.target.value)}
                      className="px-3.5 py-2 rounded-xl bg-slate-900 border border-slate-700 text-xs font-semibold text-white"
                    >
                      {classes.map((c) => (
                        <option key={c.id} value={c.name}>
                          Kelas {c.name}
                        </option>
                      ))}
                    </select>
                    <button
                      onClick={() => window.print()}
                      disabled={batchStudents.length === 0}
                      className="px-4 py-2 rounded-xl bg-blue-600 disabled:opacity-40 text-white text-xs font-semibold flex items-center gap-2"
                    >
                      <Icons.Printer className="w-4 h-4" />
                      Cetak Semua ({batchStudents.length})
                    </button>
                    <button
                      onClick={() => setBatchPrintOpen(false)}
                      className="p-2 rounded-xl bg-slate-800 text-slate-300"
                    >
                      <Icons.X className="w-4 h-4" />
                    </button>
                  </div>
                </div>

                <div id="printable-area" className="p-6 overflow-y-auto flex flex-wrap justify-center gap-4">
                  {batchStudents.map((st) => (
                    <div
                      key={st.id}
                      style={{ width: "85.6mm", height: "54mm" }}
                      className="qr-id-card rounded-2xl bg-gradient-to-br from-slate-900 via-blue-950 to-slate-900 border border-blue-500/40 p-3 flex flex-col justify-between overflow-hidden"
                    >
                      <div className="border-b border-blue-400/25 pb-1 flex items-center justify-between">
                        <div>
                          <p className="text-[9px] font-extrabold uppercase text-blue-400 leading-none">{teacher.school}</p>
                          <p className="text-[9.5px] font-bold text-white mt-0.5">

                          </p>

                        </span>

                      <div className="flex items-center justify-between gap-2.5 pt-0.5 flex-1">

    // =========================================================================
    // 3. DATA KELAS VIEW
    // =========================================================================
    function ClassesView({ classes, setClasses, students, setStudents, callGasPost, showToast }) {
      const [modalOpen, setModalOpen] = useState(false);
      const [editingClass, setEditingClass] = useState(null);
      const [viewingClass, setViewingClass] = useState(null);
      const [formData, setFormData] = useState({ name: "", grade: "VII", waliKelas: "", room: "Lab Komputer 1" });

      const handleSave = async (e) => {
        e.preventDefault();
        const cleanName = formData.name.trim().toUpperCase();
        if (!cleanName) return;

        if (editingClass) {
          const oldName = editingClass.name;
          setClasses((prev) =>
            prev.map((c) => (c.id === editingClass.id ? { ...c, ...formData, name: cleanName } : c))
          );
          if (oldName !== cleanName) {
            setStudents((prev) => prev.map((s) => (s.className === oldName ? { ...s, className: cleanName } : s)));
          }
          await callGasPost("saveClass", { id: editingClass.id, ...formData, name: cleanName });
          showToast("success", "Kelas Diperbarui", `Kelas ${cleanName} disimpan.`);
        } else {
          if (classes.some((c) => c.name === cleanName)) {
            showToast("error", "Kelas Sudah Ada", `Kelas ${cleanName} sudah terdaftar.`);
            return;
          }
          const newCls = { id: `CLS-${Date.now()}`, ...formData, name: cleanName };
          setClasses((prev) => [...prev, newCls]);
          await callGasPost("saveClass", newCls);
          showToast("success", "Kelas Ditambahkan", `Kelas ${cleanName} berhasil dibuat.`);
        }
        setModalOpen(false);
      };

      const handleDelete = async (cls) => {
        setClasses((prev) => prev.filter((c) => c.id !== cls.id));
        await callGasPost("deleteClass", { id: cls.id });
        showToast("warning", "Kelas Dihapus", `Kelas ${cls.name} dihapus.`);
      };

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 p-5 rounded-2xl bg-[#0F172A] border border-slate-800 shadow-xl">
            <div>
              <h3 className="text-base font-bold text-white">Manajemen Data Kelas SMP</h3>
              <p className="text-xs text-slate-400">Kelola rombongan belajar mata pelajaran Informatika</p>
            </div>
            <button
              onClick={() => {
                setEditingClass(null);
                setFormData({ name: "", grade: "VII", waliKelas: "", room: "Lab Komputer 1" });

    // =========================================================================
    // 4. ABSENSI QR CODE (KAMERA SAJA + BOX ABSENSI MANUAL + TAMBAH PERTEMUAN)
    // =========================================================================
    function QRScannerView({
      students,
      classes,
      meetings,
      setMeetings,
      attendance,
      setAttendance,
      teacher,
      callGasPost,
      showToast,
      playBeep
    }) {
      const [selectedClass, setSelectedClass] = useState(classes[0]?.name || "7A");
      const [meeting, setMeeting] = useState(meetings[0] || "Pertemuan 1");
      const [addMeetingOpen, setAddMeetingOpen] = useState(false);
      const [newMeetingName, setNewMeetingName] = useState("");
      const [sessionDate, setSessionDate] = useState(getTodayDate());
      const [sessionOpen, setSessionOpen] = useState(false);
      const [cameraActive, setCameraActive] = useState(false);
      const [soundEnabled, setSoundEnabled] = useState(true);
      const [manualCode, setManualCode] = useState("");
      const [lastScanResult, setLastScanResult] = useState(null);

      const [manualModalOpen, setManualModalOpen] = useState(false);
      const [manualForm, setManualForm] = useState({
        className: classes[0]?.name || "7A",
        studentId: "",
        meeting: meetings[0] || "Pertemuan 1",
        date: getTodayDate(),
        status: "Hadir",
        note: ""
      });

      const scannerRef = useRef(null);
      const lastScannedRef = useRef({ code: "", ts: 0 });

      const processScannedCode = async (rawCode) => {
        const code = String(rawCode || "").trim();
        if (!code) return;
        const now = Date.now();
        if (lastScannedRef.current.code === code && now - lastScannedRef.current.ts < 2500) return;
        lastScannedRef.current = { code, ts: now };

        if (!sessionOpen) {
          if (soundEnabled) playBeep(false);
          showToast("warning", "Sesi Belum Dibuka", "Buka sesi absensi terlebih dahulu.");
          return;
        }

        const foundStudent = students.find(
          (s) => s.qrCode.toLowerCase() === code.toLowerCase() || s.nis === code
        );
        if (!foundStudent) {
          if (soundEnabled) playBeep(false);
          setLastScanResult({ status: "error", title: "QR Code Tidak Terdaftar", detail: `Kode "${code}" ditolak.` });
          showToast("error", "QR Tidak Terdaftar", `Kode "${code}" tidak dikenali.`);
          return;
        }

        if (foundStudent.className !== selectedClass) {
          if (soundEnabled) playBeep(false);
          setLastScanResult({
            status: "error",
            title: "Salah Kelas",
            detail: `${foundStudent.name} terdaftar di kelas ${foundStudent.className}.`
          });
          showToast("error", "Beda Kelas", `${foundStudent.name} berasal dari kelas ${foundStudent.className}.`);
          return;
        }

        if (
          attendance.some(
            (a) => a.studentId === foundStudent.id && a.date === sessionDate && a.meeting === meeting
          )
        ) {
          if (soundEnabled) playBeep(false);
          setLastScanResult({
            status: "warning",
            title: "Sudah Absen",
            detail: `${foundStudent.name} sudah tercatat pada ${meeting}.`
          });
          showToast("warning", "Duplikasi Dicegah", `${foundStudent.name} sudah absen.`);
          return;
        }

        const newRecord = {
          id: `ATT-${Date.now()}`,
          studentId: foundStudent.id,
          nis: foundStudent.nis,
          studentName: foundStudent.name,
          className: foundStudent.className,
          subject: teacher.subject,
          meeting,
          date: sessionDate,
          time: getCurrentTime(),
          status: "Hadir",
          note: "Scan QR Code"
        };

        setAttendance((prev) => [newRecord, ...prev]);
        await callGasPost("recordAttendance", newRecord);
        if (soundEnabled) playBeep(true);
        setLastScanResult({
          status: "success",
          title: "Absensi Berhasil!",
          detail: `${foundStudent.name} (${foundStudent.nis}) — HADIR pukul ${newRecord.time}`
        });
        showToast("success", "HADIR Tercatat", `${foundStudent.name} berhasil absen.`);
      };

      useEffect(() => {
        if (cameraActive && sessionOpen && window.Html5Qrcode) {
          try {
            const html5Qr = new window.Html5Qrcode("qr-reader-box");
            scannerRef.current = html5Qr;
            html5Qr
              .start(
                { facingMode: "environment" },
                { fps: 12, qrbox: { width: 220, height: 220 } },
                (decoded) => processScannedCode(decoded),
                () => {}
              )
              .catch(() => setCameraActive(false));
          } catch (e) {
            setCameraActive(false);
          }
        }
        return () => {
          if (scannerRef.current) {
            scannerRef.current.stop().catch(() => {});
            scannerRef.current = null;
          }
        };
      }, [cameraActive, sessionOpen, selectedClass, meeting, sessionDate]);

      const manualModalStudents = useMemo(
        () => students.filter((s) => s.className === manualForm.className),
        [students, manualForm.className]
      );

      const handleSubmitManualBox = async (e) => {
        e.preventDefault();
        const targetStudent = students.find((s) => s.id === manualForm.studentId);
        if (!targetStudent) return;

        const recordPayload = {
          id: `ATT-${Date.now()}-${targetStudent.id}`,
          studentId: targetStudent.id,

          status: manualForm.status,
          note: manualForm.note.trim() || `Absensi manual (${manualForm.status})`,
          allowOverwrite: true
        };

        const existing = attendance.find(
          (a) =>
            a.studentId === targetStudent.id &&
            a.date === manualForm.date &&
            a.meeting === manualForm.meeting
        );

        if (existing) {

            prev.map((a) => (a.id === existing.id ? { ...a, ...recordPayload, id: a.id } : a))
          );
        } else {
          setAttendance((prev) => [recordPayload, ...prev]);
        }

        await callGasPost("recordAttendance", recordPayload);
        showToast(

    // =========================================================================
    // 5. RIWAYAT ABSENSI (KETERANGAN READ-ONLY + TOMBOL SIMPAN STATUS)
    // =========================================================================
    function HistoryView({ attendance, setAttendance, classes, meetings, callGasPost, showToast }) {
      const [filterClass, setFilterClass] = useState("ALL");
      const [filterDate, setFilterDate] = useState("");
      const [filterMeeting, setFilterMeeting] = useState("ALL");
      const [search, setSearch] = useState("");
      const [pendingStatuses, setPendingStatuses] = useState({});

      const filtered = useMemo(() => {
        return attendance.filter((a) => {
          if (filterClass !== "ALL" && a.className !== filterClass) return false;
          if (filterDate && a.date !== filterDate) return false;
          if (filterMeeting !== "ALL" && a.meeting !== filterMeeting) return false;
          if (search && !a.studentName.toLowerCase().includes(search.toLowerCase()) && !a.nis.includes(search))
            return false;
          return true;
        });
      }, [attendance, filterClass, filterDate, filterMeeting, search]);

      const handleSaveStatusUpdate = async (item) => {
        const newStatus = pendingStatuses[item.id];
        if (!newStatus) return;
        const newTime = newStatus === "Hadir" && item.time === "-" ? getCurrentTime() : item.time;
        setAttendance((prev) =>
          prev.map((a) => (a.id === item.id ? { ...a, status: newStatus, time: newTime } : a))
        );
        await callGasPost("updateAttendanceStatus", { id: item.id, status: newStatus, time: newTime });
        setPendingStatuses((prev) => {
          const next = { ...prev };
          delete next[item.id];
          return next;
        });
        showToast("success", "Status Tersimpan", `Status ${item.studentName} diubah menjadi ${newStatus}.`);
      };

      return (
        <div className="space-y-6">
          <div className="p-5 rounded-2xl bg-[#0F172A] border border-slate-800 shadow-xl grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
            <input
              type="text"
              value={search}
              onChange={(e) => setSearch(e.target.value)}
              placeholder="Cari nama atau NIS..."
              className="px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white"
            />
            <select
              value={filterClass}
              onChange={(e) => setFilterClass(e.target.value)}
              className="px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white"
            >
              <option value="ALL">Semua Kelas</option>
              {classes.map((c) => (
                <option key={c.id} value={c.name}>
                  Kelas {c.name}
                </option>
              ))}
            </select>
            <input
              type="date"
              value={filterDate}
              onChange={(e) => setFilterDate(e.target.value)}
              className="px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white"
            />
            <select
              value={filterMeeting}
              onChange={(e) => setFilterMeeting(e.target.value)}
              className="px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white"
            >
              <option value="ALL">Semua Pertemuan</option>
              {meetings.map((m) => (
                <option key={m} value={m}>
                  {m}
                </option>
              ))}
            </select>
          </div>

          <div className="rounded-2xl bg-[#0F172A] border border-slate-800 overflow-hidden shadow-xl">
            <div className="overflow-x-auto">
              <table className="w-full text-left border-collapse">
                <thead>
                  <tr className="bg-slate-900 border-b border-slate-800 text-[11px] uppercase text-slate-400">
                    <th className="py-3.5 px-4">No</th>
                    <th className="py-3.5 px-4">Nama Siswa</th>
                    <th className="py-3.5 px-4">NIS</th>
                    <th className="py-3.5 px-4">Kelas</th>
                    <th className="py-3.5 px-4">Tanggal</th>
                    <th className="py-3.5 px-4">Jam Masuk</th>
                    <th className="py-3.5 px-4">Status Kehadiran</th>
                    <th className="py-3.5 px-4">Keterangan</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800 text-xs sm:text-sm">
                  {filtered.map((item, idx) => {
                    const draftStatus = pendingStatuses[item.id] ?? item.status;
                    const hasChanges = pendingStatuses[item.id] !== undefined;
                    return (
                      <tr key={item.id} className="hover:bg-slate-800/40">
                        <td className="py-3.5 px-4 text-slate-400">{idx + 1}</td>
                        <td className="py-3.5 px-4 font-semibold text-white">{item.studentName}</td>
                        <td className="py-3.5 px-4 font-mono text-slate-300">{item.nis}</td>
                        <td className="py-3.5 px-4 text-slate-300">{item.className}</td>
                        <td className="py-3.5 px-4 text-slate-300">{item.date}</td>
                        <td className="py-3.5 px-4 font-mono text-slate-300">{item.time}</td>
                        <td className="py-3.5 px-4">
                          <div className="flex items-center gap-2">
                            <select
                              value={draftStatus}
                              onChange={(e) => {
                                const val = e.target.value;
                                setPendingStatuses((prev) => {
                                  const next = { ...prev };
                                  if (val === item.status) delete next[item.id];
                                  else next[item.id] = val;
                                  return next;
                                });
                              }}
                              className="px-2.5 py-1.5 rounded-lg bg-slate-900 border border-slate-700 text-xs font-semibold text-white"
                            >
                              <option value="Hadir">Hadir</option>
                              <option value="Izin">Izin</option>
                              <option value="Sakit">Sakit</option>
                              <option value="Alfa">Alfa</option>
                            </select>
                            {hasChanges && (
                              <button
                                onClick={() => handleSaveStatusUpdate(item)}
                                className="px-2.5 py-1.5 rounded-lg bg-blue-600 text-white text-xs font-semibold flex items-center gap-1"
                              >
                                <Icons.Check className="w-3.5 h-3.5" />
                                Simpan
                              </button>
                            )}
                          </div>
                        </td>
                        <td className="py-3.5 px-4 text-xs text-slate-300">{item.note || "-"}</td>
                      </tr>
                    );
                  })}
                  {filtered.length === 0 && (
                    <tr>
                      <td colSpan="8" className="py-10 text-center text-slate-500">
                        Belum ada riwayat absensi.
                      </td>
                    </tr>
                  )}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 6. REKAP ABSENSI (PDF TABEL STANDAR: NAMA, KELAS, NIS, PERSENTASE)
    // =========================================================================
    function RecapReportView({ attendance, students, classes, teacher, showToast }) {
      const [period, setPeriod] = useState("harian");
      const [selectedClass, setSelectedClass] = useState("ALL");
      const [refDate, setRefDate] = useState(getTodayDate());

      const recapRows = useMemo(() => {
        const baseDate = new Date(refDate || getTodayDate());
        const filteredAtt = attendance.filter((a) => {
          if (selectedClass !== "ALL" && a.className !== selectedClass) return false;
          const d = new Date(a.date);
          if (period === "harian") return a.date === refDate;
          if (period === "mingguan") return Math.abs((baseDate - d) / 86400000) <= 7;
          if (period === "bulanan")
            return d.getFullYear() === baseDate.getFullYear() && d.getMonth() === baseDate.getMonth();
          return true;
        });

        const targetStudents =
          selectedClass === "ALL" ? students : students.filter((s) => s.className === selectedClass);

        return targetStudents.map((st, idx) => {
          const recs = filteredAtt.filter((a) => a.studentId === st.id);
          const hadir = recs.filter((r) => r.status === "Hadir").length;
          const izin = recs.filter((r) => r.status === "Izin").length;
          const sakit = recs.filter((r) => r.status === "Sakit").length;
          const alfa = recs.filter((r) => r.status === "Alfa").length;
          const pct = recs.length > 0 ? Math.round((hadir / recs.length) * 100) : 0;
          return { no: idx + 1, id: st.id, name: st.name, nis: st.nis, className: st.className, hadir, izin, sakit, alfa, pct };
        });
      }, [attendance, students, selectedClass, period, refDate]);

      const handleExportExcel = () => {
        if (!window.XLSX) return;
        const ws = window.XLSX.utils.json_to_sheet(
          recapRows.map((r) => ({
            No: r.no,
            "Nama Siswa": r.name,
            NIS: r.nis,
            Kelas: r.className,
            Hadir: r.hadir,
            Izin: r.izin,
            Sakit: r.sakit,
            Alfa: r.alfa,
            "Persentase Kehadiran": `${r.pct}%`
          }))
        );
        const wb = window.XLSX.utils.book_new();
        window.XLSX.utils.book_append_sheet(wb, ws, "Rekap Absensi");
        window.XLSX.writeFile(wb, `Rekap_Absensi_${teacher.subject}_${period}.xlsx`);
        showToast("success", "Excel Diunduh", "Laporan rekap Excel berhasil dibuat.");
      };

      const handleExportPDF = () => {
        if (!window.jspdf) return;
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
        doc.setTextColor(0, 0, 0);
        doc.setFont("helvetica", "bold");
        doc.setFontSize(13);
        doc.text(`REKAPITULASI ABSENSI SISWA - ${teacher.school.toUpperCase()}`, 14, 16);
        doc.setFont("helvetica", "normal");
        doc.setFontSize(10);
        doc.text(`Mata Pelajaran: ${teacher.subject} | Periode: ${period.toUpperCase()}`, 14, 23);

        const cols = [
          { label: "No", w: 14 },
          { label: "Nama Siswa", w: 76 },
          { label: "Kelas", w: 24 },
          { label: "NIS", w: 36 },
          { label: "Persentase Kehadiran", w: 32 }
        ];
        let y = 30;
        const rowH = 8;

        const drawRow = (cells, isHeader = false) => {
          if (y + rowH > 282) {
            doc.addPage();
            y = 16;
          }
          doc.setFont("helvetica", isHeader ? "bold" : "normal");
          doc.setFontSize(9.5);
          let x = 14;
          cells.forEach((txt, idx) => {
            doc.rect(x, y, cols[idx].w, rowH);
            doc.text(String(txt), x + 2, y + 5.5);
            x += cols[idx].w;
          });
          y += rowH;
        };

        drawRow(cols.map((c) => c.label), true);
        recapRows.forEach((r) => drawRow([r.no, r.name, r.className, r.nis, `${r.pct}%`], false));
        doc.save(`Rekap_Absensi_${teacher.subject}_${period}.pdf`);
        showToast("success", "PDF Diunduh", "Laporan PDF tabel standar berhasil diunduh.");
      };

      return (
        <div className="space-y-6">
          <div className="p-5 rounded-2xl bg-[#0F172A] border border-slate-800 shadow-xl flex flex-col lg:flex-row lg:items-center justify-between gap-4 no-print">
            <div className="flex flex-wrap items-center gap-2">
              {["harian", "mingguan", "bulanan", "semester"].map((p) => (
                <button
                  key={p}
                  onClick={() => setPeriod(p)}
                  className={`px-3.5 py-2 rounded-xl text-xs font-semibold capitalize ${
                    period === p ? "bg-blue-600 text-white" : "bg-slate-900 text-slate-400 border border-slate-800"
                  }`}
                >
                  {p}
                </button>
              ))}
              <select
                value={selectedClass}
                onChange={(e) => setSelectedClass(e.target.value)}
                className="px-3 py-2 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white"
              >
                <option value="ALL">Semua Kelas</option>
                {classes.map((c) => (
                  <option key={c.id} value={c.name}>
                    Kelas {c.name}
                  </option>
                ))}
              </select>
              <input
                type="date"
                value={refDate}
                onChange={(e) => setRefDate(e.target.value)}
                className="px-3 py-2 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white"
              />
            </div>
            <div className="flex gap-2">
              <button
                onClick={handleExportExcel}
                className="px-3.5 py-2 rounded-xl bg-emerald-600/20 text-emerald-300 border border-emerald-500/30 text-xs font-semibold flex items-center gap-1.5"
              >
                <Icons.FileSpreadsheet className="w-4 h-4" /> Excel
              </button>
              <button

                className="px-3.5 py-2 rounded-xl bg-rose-600/20 text-rose-300 border border-rose-500/30 text-xs font-semibold flex items-center gap-1.5"

                <Icons.FileText className="w-4 h-4" /> PDF
              </button>
              <button
                onClick={() => window.print()}
                className="px-3.5 py-2 rounded-xl bg-blue-600 text-white text-xs font-semibold flex items-center gap-1.5"

                <Icons.Printer className="w-4 h-4" /> Cetak

            </div>
          </div>

          <div id="printable-area" className="rounded-2xl bg-[#0F172A] border border-slate-800 overflow-hidden shadow-xl">
            <div className="overflow-x-auto">
              <table className="w-full text-left border-collapse">
                <thead>
                  <tr className="bg-slate-900 border-b border-slate-800 text-[11px] uppercase text-slate-400">
                    <th className="py-3.5 px-4">No</th>
                    <th className="py-3.5 px-4">Nama Siswa</th>
                    <th className="py-3.5 px-4">NIS</th>
                    <th className="py-3.5 px-4">Kelas</th>

                <tbody className="divide-y divide-slate-800 text-xs sm:text-sm">

                    <tr key={r.id}>

    // =========================================================================
    // 7. DAFTAR NILAI INFORMATIKA (BOBOT DINAMIS + EKSPOR EXCEL & PDF)
    // =========================================================================
    function GradesView({
      students,
      classes,
      grades,
      setGrades,
      gradeWeights,
      setGradeWeights,
      teacher,
      callGasPost,
      showToast
    }) {
      const [selectedClass, setSelectedClass] = useState(classes[0]?.name || "7A");
      const [weightOpen, setWeightOpen] = useState(false);
      const [draft, setDraft] = useState({ ...gradeWeights });

      const totalWeight = Number(draft.harian || 0) + Number(draft.uts || 0) + Number(draft.uas || 0);
      const classStudents = useMemo(
        () => students.filter((s) => s.className === selectedClass),
        [students, selectedClass]
      );

      const calcFinal = (g) =>
        Math.round(
          ((g?.harian ?? 0) * gradeWeights.harian +
            (g?.uts ?? 0) * gradeWeights.uts +
            (g?.uas ?? 0) * gradeWeights.uas) /
            100
        );

      const getPred = (s) => (s >= 90 ? "A" : s >= 80 ? "B" : s >= 70 ? "C" : "D");

      const handleScoreChange = async (st, field, val) => {
        const num = Math.max(0, Math.min(100, Number(val) || 0));
        const nextGrade = {
          harian: grades[st.id]?.harian ?? 0,
          uts: grades[st.id]?.uts ?? 0,
          uas: grades[st.id]?.uas ?? 0,
          [field]: num
        };
        setGrades((prev) => ({ ...prev, [st.id]: nextGrade }));
        const akhir = calcFinal(nextGrade);
        await callGasPost("saveGrade", {
          studentId: st.id,
          nis: st.nis,
          studentName: st.name,
          className: st.className,
          ...nextGrade,
          akhir,
          predikat: getPred(akhir)
        });
      };

      const handleExportGradesExcel = () => {
        if (!window.XLSX) return;
        const rows = classStudents.map((st, idx) => {
          const g = grades[st.id] || { harian: 0, uts: 0, uas: 0 };
          const akhir = calcFinal(g);
          return {
            No: idx + 1,
            "Nama Siswa": st.name,
            NIS: st.nis,
            [`Harian (${gradeWeights.harian}%)`]: g.harian,
            [`UTS (${gradeWeights.uts}%)`]: g.uts,
            [`UAS (${gradeWeights.uas}%)`]: g.uas,
            "Nilai Akhir": akhir,
            Predikat: getPred(akhir)
          };
        });
        const ws = window.XLSX.utils.json_to_sheet(rows);
        const wb = window.XLSX.utils.book_new();
        window.XLSX.utils.book_append_sheet(wb, ws, `Nilai ${selectedClass}`);
        window.XLSX.writeFile(wb, `Daftar_Nilai_${teacher.subject}_${selectedClass}.xlsx`);
        showToast("success", "Excel Nilai Diunduh", `Daftar nilai kelas ${selectedClass} diunduh.`);
      };

      const handleExportGradesPDF = () => {
        if (!window.jspdf) return;
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
        doc.setTextColor(0, 0, 0);
        doc.setFont("helvetica", "bold");
        doc.setFontSize(13);
        doc.text(`DAFTAR NILAI ${teacher.subject.toUpperCase()} - ${teacher.school.toUpperCase()}`, 14, 16);
        doc.setFont("helvetica", "normal");
        doc.setFontSize(10);
        doc.text(`Kelas: ${selectedClass} | Tahun Ajaran: ${teacher.academicYear} (${teacher.semester})`, 14, 23);

        const cols = [
          { label: "No", w: 12 },
          { label: "Nama Siswa", w: 58 },
          { label: "NIS", w: 28 },
          { label: `Harian (${gradeWeights.harian}%)`, w: 22 },
          { label: `UTS (${gradeWeights.uts}%)`, w: 18 },
          { label: `UAS (${gradeWeights.uas}%)`, w: 18 },
          { label: "Akhir", w: 14 },
          { label: "Pred", w: 12 }
        ];
        let y = 30;
        const rowH = 8;

        const drawRow = (cells, isHeader = false) => {
          if (y + rowH > 282) {
            doc.addPage();
            y = 16;
          }
          doc.setFont("helvetica", isHeader ? "bold" : "normal");
          doc.setFontSize(8.5);
          let x = 14;
          cells.forEach((txt, idx) => {
            doc.rect(x, y, cols[idx].w, rowH);
            doc.text(String(txt), x + 1.5, y + 5.5);
            x += cols[idx].w;
          });
          y += rowH;
        };

        drawRow(cols.map((c) => c.label), true);
        classStudents.forEach((st, idx) => {
          const g = grades[st.id] || { harian: 0, uts: 0, uas: 0 };
          const akhir = calcFinal(g);
          drawRow([idx + 1, st.name, st.nis, g.harian, g.uts, g.uas, akhir, getPred(akhir)], false);
        });
        doc.save(`Daftar_Nilai_${teacher.subject}_${selectedClass}.pdf`);
        showToast("success", "PDF Nilai Diunduh", `Daftar nilai kelas ${selectedClass} diunduh.`);
      };

      return (
        <div className="space-y-6">
          <div className="p-5 rounded-2xl bg-[#0F172A] border border-slate-800 shadow-xl flex flex-col lg:flex-row lg:items-center justify-between gap-4">
            <div className="flex flex-wrap items-center gap-3">
              <select
                value={selectedClass}
                onChange={(e) => setSelectedClass(e.target.value)}
                className="px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-xs sm:text-sm text-white font-semibold"
              >
                {classes.map((c) => (
                  <option key={c.id} value={c.name}>
                    Kelas {c.name}
                  </option>
                ))}
              </select>
              <span className="text-xs text-slate-300 bg-slate-900 px-3 py-2 rounded-xl border border-slate-800">
                Bobot: Harian {gradeWeights.harian}% • UTS {gradeWeights.uts}% • UAS {gradeWeights.uas}%
              </span>
            </div>
            <div className="flex flex-wrap gap-2">
              <button
                onClick={() => {
                  setDraft({ ...gradeWeights });
                  setWeightOpen(!weightOpen);
                }}
                className="px-3.5 py-2.5 rounded-xl bg-blue-600/20 text-blue-300 border border-blue-500/30 text-xs font-semibold flex items-center gap-1.5"
              >
                <Icons.Settings className="w-4 h-4" /> Atur Bobot Nilai
              </button>
              <button
                onClick={handleExportGradesExcel}
                className="px-3.5 py-2.5 rounded-xl bg-emerald-600/20 text-emerald-300 border border-emerald-500/30 text-xs font-semibold flex items-center gap-1.5"
              >
                <Icons.FileSpreadsheet className="w-4 h-4" /> Ekspor Excel
              </button>
              <button
                onClick={handleExportGradesPDF}
                className="px-3.5 py-2.5 rounded-xl bg-rose-600/20 text-rose-300 border border-rose-500/30 text-xs font-semibold flex items-center gap-1.5"
              >
                <Icons.FileText className="w-4 h-4" /> Ekspor PDF
              </button>
            </div>
          </div>

          {weightOpen && (
            <form
              onSubmit={async (e) => {
                e.preventDefault();
                if (totalWeight !== 100) return;
                setGradeWeights({
                  harian: Number(draft.harian),
                  uts: Number(draft.uts),
                  uas: Number(draft.uas)
                });
                await callGasPost("saveTeacherSettings", {
                  ...teacher,
                  bobotHarian: Number(draft.harian),
                  bobotUTS: Number(draft.uts),
                  bobotUAS: Number(draft.uas)
                });
                setWeightOpen(false);
                showToast("success", "Bobot Diperbarui", "Bobot penilaian berhasil disimpan.");
              }}
              className="p-5 rounded-2xl bg-[#0F172A] border border-blue-500/40 space-y-4"
            >
              <div className="grid grid-cols-3 gap-4">
                <div>
                  <label className="block text-xs text-slate-300 mb-1">Harian (%)</label>
                  <input
                    type="number"
                    value={draft.harian}
                    onChange={(e) => setDraft({ ...draft, harian: Number(e.target.value) })}
                    className="w-full px-3 py-2 rounded-xl bg-slate-900 border border-slate-700 text-sm text-white"
                  />
                </div>
                <div>
                  <label className="block text-xs text-slate-300 mb-1">UTS (%)</label>
                  <input
                    type="number"
                    value={draft.uts}
                    onChange={(e) => setDraft({ ...draft, uts: Number(e.target.value) })}
                    className="w-full px-3 py-2 rounded-xl bg-slate-900 border border-slate-700 text-sm text-white"
                  />
                </div>
                <div>
                  <label className="block text-xs text-slate-300 mb-1">UAS (%)</label>
                  <input
                    type="number"
                    value={draft.uas}
                    onChange={(e) => setDraft({ ...draft, uas: Number(e.target.value) })}
                    className="w-full px-3 py-2 rounded-xl bg-slate-900 border border-slate-700 text-sm text-white"
                  />
                </div>
              </div>
              <div className="flex items-center justify-between">
                <span className={`text-xs font-bold ${totalWeight === 100 ? "text-emerald-400" : "text-rose-400"}`}>
                  Total Bobot: {totalWeight}% {totalWeight === 100 ? "(Valid)" : "(Harus 100%)"}
                </span>
                <button
                  type="submit"
                  disabled={totalWeight !== 100}
                  className="px-4 py-2 rounded-xl bg-blue-600 disabled:opacity-40 text-white text-xs font-semibold"
                >
                  Simpan Bobot
                </button>
              </div>
            </form>
          )}

          <div className="rounded-2xl bg-[#0F172A] border border-slate-800 overflow-hidden shadow-xl">
            <div className="overflow-x-auto">
              <table className="w-full text-left border-collapse">
                <thead>
                  <tr className="bg-slate-900 border-b border-slate-800 text-[11px] uppercase text-slate-400">
                    <th className="py-3.5 px-4">No</th>
                    <th className="py-3.5 px-4">Nama Siswa</th>
                    <th className="py-3.5 px-4">NIS</th>
                    <th className="py-3.5 px-4">Harian ({gradeWeights.harian}%)</th>
                    <th className="py-3.5 px-4">UTS ({gradeWeights.uts}%)</th>
                    <th className="py-3.5 px-4">UAS ({gradeWeights.uas}%)</th>
                    <th className="py-3.5 px-4 text-center">Akhir</th>
                    <th className="py-3.5 px-4 text-center">Predikat</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800 text-xs sm:text-sm">
                  {classStudents.map((st, idx) => {
                    const g = grades[st.id] || { harian: 0, uts: 0, uas: 0 };
                    const akhir = calcFinal(g);
                    return (
                      <tr key={st.id}>
                        <td className="py-3 px-4 text-slate-400">{idx + 1}</td>
                        <td className="py-3 px-4 font-semibold text-white">{st.name}</td>
                        <td className="py-3 px-4 font-mono text-slate-300">{st.nis}</td>
                        <td className="py-3 px-4">
                          <input
                            type="number"
                            min="0"
                            max="100"
                            value={g.harian}
                            onChange={(e) => handleScoreChange(st, "harian", e.target.value)}
                            className="w-20 px-2 py-1.5 rounded-lg bg-slate-900 border border-slate-700 text-xs text-white text-center"
                          />
                        </td>
                        <td className="py-3 px-4">
                          <input
                            type="number"
                            min="0"
                            max="100"
                            value={g.uts}
                            onChange={(e) => handleScoreChange(st, "uts", e.target.value)}
                            className="w-20 px-2 py-1.5 rounded-lg bg-slate-900 border border-slate-700 text-xs text-white text-center"
                          />
                        </td>
                        <td className="py-3 px-4">
                          <input
                            type="number"
                            min="0"
                            max="100"
                            value={g.uas}
                            onChange={(e) => handleScoreChange(st, "uas", e.target.value)}
                            className="w-20 px-2 py-1.5 rounded-lg bg-slate-900 border border-slate-700 text-xs text-white text-center"
                          />
                        </td>
                        <td className="py-3 px-4 text-center font-extrabold text-blue-400">{akhir}</td>
                        <td className="py-3 px-4 text-center font-bold text-blue-300">{getPred(akhir)}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }
